<html lang="fr">
  <head>
    <meta charset="UTF-8" />

  </head>
    <body>
    <a href="#main" class="screen-reader-only focusable skip-link">Aller au contenu</a>
    <header>
      <nav class="nav-menu" aria-label="Navigation principale">
        <!-- Bouton Menu / Fermer -->
        <button
          class="nav-menu__toggle"
          aria-expanded="false"
          aria-controls="nav-menu-list"
          aria-label="Ouvrir le menu de navigation"
        >
          <!-- L'icône doit être positionnée en premier pour le sélecteur CSS adjacent (+) -->
          <span class="nav-menu__hamburger-icon" aria-hidden="true"></span>
          <span class="nav-menu__libelle">Menu</span>
        </button>

        <!-- Liste des liens de navigation -->
        <ul id="nav-menu-list" class="nav-menu__list">
          <li class="nav-menu__item">
            <a href="#home" class="nav-menu__link">Fouler</a>
          </li>
          <li class="nav-menu__item">

          </li>
          <li class="nav-menu__item">
            <a href="#about" class="nav-menu__link">Femme</a>
          </li>
          <li class="nav-menu__item">
            <a href="#contact" class="nav-menu__link">Enfant</a>
          </li>
          <li class="nav-menu__item">
            <a href="#contact" class="nav-menu__link">Sport</a>
          </li>
          <li class="nav-menu__item">
            <a href="#contact" class="nav-menu__link">Personnaliser</a>
          </li>
          <li class="nav-menu__item">
            <a href="#contact" class="nav-menu__link">Fouler+</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
        <p class="chemin-acces">Accueil > Chaussure</p>
        <h1 class="titre-principale">Chaussures</h1>
        <p class="texte">12 produits</p>
        <ul class="filtre-haut" aria-label="Filtre principal">
          <li class="filtre-haut__item"><a href="filtre-haut__link">Tous</a></li>
          <li class="filtre-haut__item"><a href="filtre-haut__link">Homme</a></li>
          <li class="filtre-haut__item"><a href="filtre-haut__link">Femme</a></li>
          <li class="filtre-haut__item"><a href="filtre-haut__link">Enfants</a></li>
        </ul>
        <div class="filtre">
          <div class="filtre-masquer">
            <img src="" alt="">
            <h2>Masquer les filtre</h2>
          </div>
          <div class="filtre-trie">
            <label for="filtre-trie__liste">Trié par </label>
            <select name="trie" id="filtre-trie__liste">
              <option value="">Nouveautés</option>
              <option value="sport">Sport</option>
              <option value="prix">Prix</option>
              <option value="couleur">Couleur</option>
              <option value="pointure">Pointure</option>
            </select>
          </div>
        </div>
        <fieldset class="fieldset-sport">
          <legend class="filtre-checkbox">Sport</legend>
          <div class="filtre-checkbox__item">
            <input type="checkbox" id="course" name="course" checked />
            <label for="course">Course</label>
          </div>
          <div class="filtre-checkbox__item">
            <input type="checkbox" id="basketball" name="basketball" />
            <label for="basketball">Basketball</label>
          </div>
          <div class="filtre-checkbox__item">
            <input type="checkbox" id="football" name="football" />
            <label for="football">Football</label>
          </div>
          <div class="filtre-checkbox__item">
            <input type="checkbox" id="training" name="training" />
            <label for="training">Training</label>
          </div>
          <div class="filtre-checkbox__item">
            <input type="checkbox" id="lifestyle" name="lifestyle" />
            <label for="lifestyle">Lifestyle</label>
          </div>
        </fieldset>
        <fieldset class="fieldset-prix">
          <legend class="filtre-checkbox">Prix</legend>
          <div class="filtre-checkbox__item">
            <input type="checkbox" id="moins" name="moins" checked />
            <label for="moins">Moins de 80$</label>
          </div>
          <div class="filtre-checkbox__item">
            <input type="checkbox" id="entre-moins" name="entre-moins" />
            <label for="entre-moins">80$ - 120$</label>
          </div>
          <div class="filtre-checkbox__item">
            <input type="checkbox" id="entre-plus" name="entre-plus" />
            <label for="entre-plus">120$ - 180$</label>
          </div>
          <div class="filtre-checkbox__item">
            <input type="checkbox" id="plus" name="plus" />
            <label for="plus">Plus de 180$</label>
          </div>
        </fieldset>
    </main>
    <footer>
        <a href="#home" class="nav-menu__link">Fouler</a>
        <nav class="" aria-label="Navigation bas de page">
            <ul id="" class="">
                <li class="nav-menu__item">

                <li class="nav-menu__item">
                    <a href="#services" class="nav-menu__link">À propos</a>
                </li>
                <li class="nav-menu__item">
                    <a href="#about" class="nav-menu__link">Support</a>
                </li>
                <li class="nav-menu__item">
                    <a href="#contact" class="nav-menu__link">Contact</a>
                </li>
            </ul>
        </nav>

            <li class="nav-menu__item">
                <a href="" class="nav-menu__link">X</a>

            </li>
        </ul>
        <p>p</p>
        <p>p</p>
    </footer>
  </body>
